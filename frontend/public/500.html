<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Server error · Kansara Premier League</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 45%, #334155 100%);
      }
      .card {
        width: min(420px, 100%);
        text-align: center;
        padding: 2rem 1.75rem;
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      }
      .code {
        margin: 0 0 0.35rem;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #94a3b8;
      }
      h1 { margin: 0 0 0.5rem; font-size: 1.45rem; color: #0f172a; }
      p { margin: 0 0 1.25rem; color: #64748b; line-height: 1.5; font-size: 0.95rem; }
      a {
        display: inline-block;
        padding: 0.6rem 1.1rem;
        border-radius: 0.5rem;
        text-decoration: none;
        background: #000066;
        color: #fff;
        font-weight: 600;
        font-size: 0.9rem;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <p class="code">500</p>
      <h1>Something went wrong</h1>
      <p>We hit an unexpected server error. Please try again in a moment.</p>
      <a href="/">Back to home</a>
    </main>
  </body>
</html>
