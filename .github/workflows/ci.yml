name: KPL CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: kpl_db
          POSTGRES_USER: kpl_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Lint frontend
        run: npm run lint -w @kpl/frontend --if-present

      - name: Build packages
        run: npm run build --workspaces --if-present
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: kpl_db
          DB_USER: kpl_user
          DB_PASSWORD: test_password
          JWT_SECRET: ci-test-secret
          JWT_REFRESH_SECRET: ci-test-refresh-secret
